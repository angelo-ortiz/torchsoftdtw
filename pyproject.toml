[build-system]
requires = ["setuptools", "torch>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "torchsoftdtw"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["torch>=2.10"]

[project.optional-dependencies]
test = [
    "hypothesis>=6.142.5",
    "numpy>=2.4.4",
    "pytest>=8.4.2",
    "softdtw-cuda-torch",
]
benchmark = [
    "numpy>=2.4.4",
    "softdtw-cuda-torch",
]

[tool.uv.sources]
softdtw-cuda-torch = { git = "https://github.com/BGU-CS-VIL/sdtw-cuda-torch.git" }

[tool.ruff]
extend-exclude = ["soft_dtw_cuda.py"]
line-length = 119
target-version = "py312"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::numba.core.errors.NumbaPerformanceWarning"]

[tool.setuptools.packages.find]
where = ["src"]
